<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');

const COURSES=[{n:'峠・ミッドナイト',bg:'#0d1012',rd:'#2b2b30',cp:[[0,0],[600,-60],[1250,0],[1650,320],[1500,720],[950,880],[1250,1300],[800,1650],[200,1450],[-250,1000],[-150,480]]},{n:'湾岸サーキット',bg:'#080c16',rd:'#1f2430',cp:[[0,0],[900,0],[1500,100],[1800,500],[1500,900],[900,1000],[300,900],[-100,500]]},{n:'北日本・雪峠',bg:'#9aa6b2',rd:'#3b3f47',cp:[[0,0],[500,-100],[900,150],[700,500],[1100,800],[800,1100],[300,900],[400,500],[-100,600],[-300,250]]},{n:'市街地・ネオンストリート',bg:'#06060e',rd:'#1c1c24',cp:[[0,0],[700,0],[1100,-250],[1700,-100],[1750,400],[1300,650],[1700,1000],[1300,1350],[700,1200],[300,1450],[-300,1250],[-250,600]]}];

const SM=40,TR=[],TW=150;let N=0,CR,MM;

function start(){cars=[mk(3,false),mk(2,true),mk(1,true),mk(0,true)];cars.forEach((c,i)=>{c.ci=i?Math.floor(Math.random()*CARS.length):save.car;c.col=CARS[c.ci].c});P=cars[0];Object.assign(P,stats());fin=0;skids=[];t0=performance.now();state='count';ov.className='h';lapT=0;P.bestLap=0;lk=9}

}

 g.fillStyle=CR.bg;g.fillRect(0,0,W,H);

 {const tm=save.tm,wx=save.wx,sx=W/2+(c0.x-cx)*z,sy=H/2+(c0.y-cy)*z,tc=['rgba(255,210,150,.10)',null,'rgba(255,110,40,.22)',null][tm];
