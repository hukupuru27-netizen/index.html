<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H;function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}rs();onresize=rs;
const COURSES=[{n:'峠・ミッドナイト',bg:'#0d1012',rd:'#2b2b30',cp:[[0,0],[600,-60],[1250,0],[1650,320],[1500,720],[950,880],[1250,1300],[800,1650],[200,1450],[-250,1000],[-150,480]]},{n:'湾岸サーキット',bg:'#080c16',rd:'#1f2430',cp:[[0,0],[900,0],[1500,100],[1800,500],[1500,900],[900,1000],[300,900],[-100,500]]},{n:'北日本・雪峠',bg:'#9aa6b2',rd:'#3b3f47',cp:[[0,0],[500,-100],[900,150],[700,500],[1100,800],[800,1100],[300,900],[400,500],[-100,600],[-300,250]]},{n:'市街地・ネオンストリート',bg:'#06060e',rd:'#1c1c24',cp:[[0,0],[700,0],[1100,-250],[1700,-100],[1750,400],[1300,650],[1700,1000],[1300,1350],[700,1200],[300,1450],[-300,1250],[-250,600]]}];
const CARS=[{n:'ストリート86',p:0,a:1,g:1,t:1,c:'#e10600'},{n:'ターボR32',p:8000,a:1.12,g:1,t:1.05,c:'#c9ccd1'},{n:'ドリフトS15',p:15000,a:1.1,g:.88,t:1.05,c:'#f2b800'},{n:'ラリーGT',p:22000,a:1.15,g:1.15,t:1.05,c:'#3a6df0'},{n:'マッスルV8',p:30000,a:1.35,g:.85,t:1.1,c:'#ff7a00'},{n:'スーパーLX',p:50000,a:1.3,g:1.2,t:1.2,c:'#ffffff'},{n:'コンパクトHB',p:4000,a:1.05,g:1.05,t:1,c:'#7bd389'},{n:'セダンGT',p:12000,a:1.12,g:1.08,t:1.05,c:'#8892a0'},{n:'SUVクロス',p:18000,a:1.1,g:1.2,t:1,c:'#3d8f5a'},{n:'ロータリーGT',p:26000,a:1.2,g:1.1,t:1.1,c:'#b04bff'},{n:'ヨーロピアンGT',p:40000,a:1.28,g:1.15,t:1.15,c:'#00c2c7'},{n:'ハイパーR',p:80000,a:1.45,g:1.25,t:1.3,c:'#ffd700'},{n:'マツダ RX-7',p:0,a:1.25,g:1.15,t:1.12,c:'#b3141c',gacha:1}];
const TUN=['エンジン','タイヤ','ブレーキ','トランス'];
const SM=40,TR=[],TW=150;let N=0,CR,MM;
const cr=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
function relax(R){const n=TR.length,rd=(i)=>{const a=TR[(i-5+n)%n],b=TR[i],c=TR[(i+5)%n],A=Math.hypot(b[0]-a[0],b[1]-a[1]),B=Math.hypot(c[0]-b[0],c[1]-b[1]),C=Math.hypot(c[0]-a[0],c[1]-a[1]),ar=Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))/2;return ar>1e-6?A*B*C/(4*ar):1e9};
for(let it=0;it<800;it++){const fl=new Set();for(let i=0;i<n;i++)if(rd(i)<R)for(let j=-3;j<=3;j++)fl.add((i+j+n)%n);if(!fl.size)break;const Q=TR.map(p=>p.slice());for(const i of fl){let x=0,y=0;for(let j=-3;j<=3;j++){const q=TR[(i+j+n)%n];x+=q[0];y+=q[1]}Q[i]=[x/7,y/7]}for(let i=0;i<n;i++)TR[i]=Q[i]}}
function buildTrack(ci){CR=COURSES[ci];const CP=CR.cp,n0=CP.length;TR.length=0;for(let i=0;i<n0;i++){const p0=CP[(i+n0-1)%n0],p1=CP[i],p2=CP[(i+1)%n0],p3=CP[(i+2)%n0];for(let k=0;k<SM;k++){const t=k/SM;TR.push([cr(p0[0],p1[0],p2[0],p3[0],t),cr(p0[1],p1[1],p2[1],p3[1],t)])}}
relax(104);N=TR.length;let a=1e9,b=1e9,c=-1e9,d=-1e9;TR.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])});MM={x:a,y:b,m:100/Math.max(c-a,d-b)};buildCache(a,b,c,d)}
let TC=null,TCx=0,TCy=0;
function buildCache(a,b,c,d){const m=TW/2+40;TCx=Math.floor(a-m);TCy=Math.floor(b-m);TC=document.createElement('canvas');TC.width=Math.ceil(c-a+2*m);TC.height=Math.ceil(d-b+2*m);const t=TC.getContext('2d');t.translate(-TCx,-TCy);const pa=()=>{t.beginPath();TR.forEach((p,i)=>i?t.lineTo(p[0],p[1]):t.moveTo(p[0],p[1]));t.closePath()};t.lineJoin='round';t.lineCap='butt';pa();t.lineWidth=TW+20;t.strokeStyle='#e8e8e8';t.stroke();t.setLineDash([22,22]);t.strokeStyle='#e10600';t.stroke();t.setLineDash([]);t.lineWidth=TW;t.strokeStyle=CR.rd;t.stroke();t.lineWidth=3;t.setLineDash([30,34]);t.strokeStyle='rgba(255,255,255,.45)';t.stroke();t.setLineDash([]);const s0=TR[0],sh=dirAt(0);t.save();t.translate(s0[0],s0[1]);t.rotate(sh);t.fillStyle='#fff';for(let i=0;i<10;i++)for(let j=0;j<2;j++){if((i+j)%2==0)t.fillRect(j*10-10,-TW/2+i*TW/10,10,TW/10)}t.restore()}
const LAPS=2;
const nm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const dirAt=i=>{const a=TR[i%N],b=TR[(i+3)%N];return Math.atan2(b[1]-a[1],b[0]-a[0])};
let save={diff:1,wins:0,bd:0,bl:0,cr:2000,own:[0],car:0,tn:{},course:0,bls:{},wx:0,tm:1};try{Object.assign(save,JSON.parse(localStorage.getItem('jdr')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('jdr',JSON.stringify(save))}catch(e){}};
let cars,P,state='title',t0=0,fin=0,skids=[],lapT=0,steer=0,thr=0,brk=0,keys={};
const cols=['#e10600','#c9ccd1','#3a6df0','#f2b800'];
function mk(j,cpu){const idx=(N-(j+1)*6+N)%N,a=TR[idx],h=dirAt(idx),s=(j%2?1:-1)*30;
return{x:a[0]-Math.sin(h)*s,y:a[1]+Math.cos(h)*s,h,vf:0,vl:0,idx,lap:-1,cpu,col:cols[j],steer:0,thr:0,brk:0,soft:0,d:0,skill:cpu?save.diff*(1.22+j*.05):1,fin:0,cur:0,dtm:0,gr:0,tot:0,cb:1,drifting:false,a:1,g:1,bm:1,dr:1,ci:0}}
function start(){cars=save.mode==1?[mk(1,false),mk(0,true)]:save.mode>=2?[mk(0,false)]:[mk(3,false),mk(2,true),mk(1,true),mk(0,true)];cars.forEach((c,i)=>{c.ci=i?Math.floor(Math.random()*CARS.length):save.car;c.col=CARS[c.ci].c});P=cars[0];Object.assign(P,stats());if(save.mode==1)cars[1].skill*=1.12;fin=0;skids=[];t0=performance.now();state='count';ov.className='h';lapT=0;P.bestLap=0;lk=9}
function upd(c,dt){
 let f=[Math.cos(c.h),Math.sin(c.h)],r=[-f[1],f[0]];
 const vx=f[0]*c.vf+r[0]*c.vl,vy=f[1]*c.vf+r[1]*c.vl,sp=Math.hypot(c.vf,c.vl);
 c.h+=c.steer*3.1*Math.min(Math.abs(c.vf)/80,1)*(c.vf>=0?1:-1)*(1-Math.min(sp/1100,.35))*dt;
 f=[Math.cos(c.h),Math.sin(c.h)];r=[-f[1],f[0]];
 c.vf=vx*f[0]+vy*f[1];c.vl=vx*r[0]+vy*r[1];
 c.vf+=c.thr*290*(c.cpu?c.skill:c.a)*dt;
 if(c.brk||c.soft){const b=Math.min(Math.abs(c.vf),(c.brk?230*c.brk*c.bm:200)*dt);c.vf-=Math.sign(c.vf)*b}
 const off=save.mode!=2&&c.d>TW/2+4;
 c.vf-=c.vf*(off?2.2:.55*c.dr)*dt;
 const grip=(off?2.5:Math.min(Math.max(2,4.5-Math.abs(c.steer)*sp/230),c.brk?4-2.7*c.brk:9))*c.g*[1,.78,.92,.97][save.wx];
 c.vl*=Math.exp(-grip*dt);
 c.x+=(f[0]*c.vf+r[0]*c.vl)*dt;c.y+=(f[1]*c.vf+r[1]*c.vl)*dt;
 let bi=c.idx,bd=1e12;
 for(let k=-22;k<=22;k++){const i=(c.idx+k+N)%N,q=TR[i],d=(q[0]-c.x)**2+(q[1]-c.y)**2;if(d<bd){bd=d;bi=i}}
 c.d=Math.sqrt(bd);
 if(save.mode!=2&&c.d>TW/2+3){const q=TR[bi],ux=(c.x-q[0])/c.d,uy=(c.y-q[1])/c.d,ex=c.d-(TW/2+3);c.x-=ux*ex;c.y-=uy*ex;f=[Math.cos(c.h),Math.sin(c.h)];r=[-f[1],f[0]];let wx=f[0]*c.vf+r[0]*c.vl,wy=f[1]*c.vf+r[1]*c.vl;const vn=wx*ux+wy*uy;if(vn>0){wx-=vn*1.4*ux;wy-=vn*1.4*uy;wx*=.97;wy*=.97;c.vf=wx*f[0]+wy*f[1];c.vl=wx*r[0]+wy*r[1];if(vn>40&&!c.cpu){c.cur=0;thud()}if(vn>50)spark(c.x,c.y)}c.d=TW/2+3}
 if(c.idx>N*.75&&bi<N*.25){c.lap++;onLap(c)}else if(c.idx<N*.25&&bi>N*.75)c.lap--;
 c.idx=bi;
 c.drifting=c.vf>120&&Math.abs(c.vl)/Math.max(c.vf,1)>.3&&!off;
 if(c.drifting&&!c.cpu&&c.fin==0){skids.push([c.x-f[0]*12+r[0]*8,c.y-f[1]*12+r[1]*8,c.x-f[0]*12-r[0]*8,c.y-f[1]*12-r[1]*8]);if(skids.length>700)skids.shift()}
}
function onLap(c){if(c.lap>=LAPS&&!c.fin&&save.mode!=2){c.fin=++fin;if(c===P)endRace()}
 if(c===P&&c.lap>0){const t=(performance.now()-lapT)/1000;if(!P.bestLap||t<P.bestLap)P.bestLap=t}if(c===P)lapT=performance.now()}
function drift(c,dt){
 const sp=Math.hypot(c.vf,c.vl),slip=Math.atan2(Math.abs(c.vl),Math.max(c.vf,1));
 if(c.drifting){c.dtm+=dt;c.gr=0;c.cb=1+Math.floor(c.dtm);c.cur+=sp*slip*dt*.1*c.cb}
 else if(c.cur>0){c.gr+=dt;if(save.mode!=2&&c.d>TW/2+4)c.cur=0;if(c.gr>.6){c.tot+=Math.floor(c.cur);c.cur=0;c.dtm=0;c.cb=1}}
}
function ai(c){
 const t=TR[(c.idx+14)%N],a=nm(Math.atan2(t[1]-c.y,t[0]-c.x)-c.h);
 c.steer=Math.max(-1,Math.min(1,a*2.2));
 const dc=Math.abs(nm(dirAt(c.idx+28)-dirAt(c.idx)));
 const ts=Math.max(200,500-dc*260)*Math.min(c.skill,1.55);
 c.thr=c.vf<ts?1:0;c.soft=c.vf>ts+35?1:0;c.brk=0;
}
function endRace(){state='done';fan();P.ft=performance.now()-P.rs;if(save.mode==2){P.tot+=Math.floor(P.cur);P.cur=0}const r=P.fin;save.bd=Math.max(save.bd,P.tot);
 if(save.mode>=2){}else if(r==1){save.wins++;save.diff=Math.min(1.25,save.diff+.04)}else save.diff=Math.max(.7,save.diff-.04*(r-1)/1.5);
 const bk='c'+save.course;save.bls=save.bls||{};if(P.bestLap&&(!save.bls[bk]||P.bestLap<save.bls[bk]))save.bls[bk]=P.bestLap;const gain=save.mode==2?Math.floor(P.tot/5):save.mode==3?1500:save.mode==1?(r==1?4000:700):[3000,1800,1000,500][r-1]+Math.floor(P.tot/10);save.cr+=gain;store();sendRank();
 const T=save.wins>=6?'ドリフトマスター':save.wins>=3?'最速の挑戦者':'峠の新人';
 setTimeout(()=>{ov.className='';ov.innerHTML=`<h1>${save.mode==2?'終了！':save.mode==3?'ゴール':r+'位 '+(r==1?'勝利!':'ゴール')}</h1><p>ドリフト得点 ${P.tot}<br>ベストラップ ${P.bestLap?P.bestLap.toFixed(2)+'秒':'-'}<br>獲得 +${gain}クレジット（所持 ${save.cr}）<br>称号：${T}（勝利 ${save.wins}回）</p><button class="s" id="go">再挑戦</button><button class="s" onclick="home()">メニュー</button>`;$('go').onclick=start},1800)}
function hit(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<34&&d>0){const o=(34-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*o;a.y-=uy*o;b.x+=ux*o;b.y+=uy*o;a.vf*=.96;b.vf*=.96;if(a===P||b===P){P.cur=0;thud()}}}
function loop(now){
 const dt=Math.min(.033,(now-(loop.l||now))/1000);loop.l=now;snd();ptUp(dt);
 if(state=='count'||state=='race'||state=='done'){
  const el=(now-t0)/1000;
  if(state=='count'){const k=3-Math.floor(el);if(k!=lk){lk=k;sfx(k>0?440:880,.25)}}
  if(state=='count'&&el>3.4){state='race';lapT=now;P.rs=now}
  if(state=='race'&&save.mode==2&&now-P.rs>60000){P.fin=fin=1;endRace()}
  for(const c of cars){
   if(c.cpu){if(state=='count'){c.thr=0;c.steer=0}else ai(c)}
   else{const live=state=='race'&&!c.fin;{const man=steer||(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),t2=TR[(c.idx+18)%N],ad=nm(Math.atan2(t2[1]-c.y,t2[0]-c.x)-c.h),as=Math.max(-1,Math.min(1,ad*2))*(1-.6*c.brk)*(save.mode==2?0:1),tg=live?(man?Math.max(-1,Math.min(1,man+as*(save.ctl?.1:.25))):as*(save.ctl?.3:.85)):0;c.steer+=(tg-c.steer)*Math.min(1,dt*(Math.abs(tg)<Math.abs(c.steer)?40:12))}c.brk=live?Math.max(brk,(keys[' ']||keys.ArrowDown||keys.s)?1:0):0;c.thr=live?1-Math.min(1,c.brk*1.5):0;c.soft=c.fin?1:0}
   upd(c,dt);if(c.cpu&&state=='race'){c.stk=Math.abs(c.vf)<40?(c.stk||0)+dt:0;if(c.stk>1.2)respawn(c)}drift(c,dt);fx(c)}
  
 }
 draw(now);requestAnimationFrame(loop)}
function txt(s,x,y,sz,col,al){g.save();g.translate(x,y);g.transform(1,0,-.2,1,0,0);g.font=`italic 900 ${sz}px Impact,"Arial Black","Hiragino Sans",sans-serif`;g.textAlign=al||'left';g.fillStyle='#000';g.fillText(s,2,2);g.fillStyle=col;g.fillText(s,0,0);g.restore()}
function path(){g.beginPath();TR.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function draw(now){
 g.fillStyle=CR.bg;g.fillRect(0,0,W,H);
 const c0=P||{x:TR[0][0],y:TR[0][1],vf:0,vl:0,h:0},sp=Math.hypot(c0.vf,c0.vl);
 const z=Math.min(W,H)/560*(1-Math.min(sp/2400,.18));

 const cx=c0.x+Math.cos(c0.h)*c0.vf*.2,cy=c0.y+Math.sin(c0.h)*c0.vf*.2;g.translate(-cx,-cy);

 g.beginPath();for(let x=x0;x<cx+W/z;x+=gs){g.moveTo(x,y0);g.lineTo(x,cy+H/z)}for(let y=y0;y<cy+H/z;y+=gs){g.moveTo(x0,y);g.lineTo(cx+W/z,y)}g.stroke();
 g.drawImage(TC,TCx,TCy);

const RN=['N','R','SR','SSR'],RC=['#9aa0aa','#3a9bff','#c070ff','#ffc400'],RAR=[0,1,1,1,2,3,0,0,0,1,2,3,2],POOL=[[0,6,7,8],[1,2,3,9],[4,10,12],[5,11]],REF=[300,1000,4000,12000],SPRU={};
const spu=i=>SPRU[i]||(SPRU[i]=spr(i).toDataURL());
function rr(){const r=Math.random()*100;return r<3?3:r<15?2:r<45?1:0}
function roll(r){const p=POOL[r];if(r==2)return Math.random()<.5?12:p.filter(x=>x!=12)[Math.random()*2|0];return p[Math.random()*p.length|0]}
function gcard(i,dup,k){const c=CARS[i],r=RAR[i],col=RC[r];return `<div style='border:2px solid ${col};box-shadow:0 0 ${6+r*6}px ${col};background:linear-gradient(#1b1b22,#0d0d11);padding:4px 2px;text-align:center;font-size:11px;animation:pop .35s ${k*.12}s both'><b style='color:${col};font:italic 900 15px Impact,Arial Black,sans-serif'>${RN[r]}</b><img src='${spu(i)}' style='width:100%;display:block'>${c.n}<br><span style='color:${dup?'#c9ccd1':'#ffdf00'}'>${dup?'重複 +'+REF[r]:'NEW!'}</span></div>`}
function gres(out,n){const top=Math.max(...out.map(o=>RAR[o[0]]));ov.innerHTML=`<div style='font:italic 900 24px Impact,Arial Black,sans-serif;color:${RC[top]}'>${n==10?'10連':'1回'}ガチャ結果</div><div style='display:grid;grid-template-columns:repeat(${n==10?5:1},1fr);gap:6px;width:min(${n==10?420:170}px,94vw);margin:8px 0'>${out.map((o,k)=>gcard(o[0],o[1],k)).join('')}</div><div style='font-size:13px;color:#c9ccd1'>所持クレジット ${save.cr}</div><button class='s'${SB} onclick='pull(${n})'>もう一度 ${n==10?18000:2000}</button><button class='s'${SB} onclick='gacha()'>戻る</button>`}
function pull(n){const cost=n==10?18000:2000;if(save.cr<cost){gacha();return}save.cr-=cost;const res=[];for(let k=0;k<n;k++)res.push(roll(rr()));if(n==10&&!res.some(i=>RAR[i]>=2))res[9]=roll(2);
const out=res.map(i=>{const d=save.own.includes(i);if(d)save.cr+=REF[RAR[i]];else save.own.push(i);return [i,d]});store();gres(out,n)}
function gacha(){const o1=save.cr<2000,o10=save.cr<18000;ov.innerHTML=`<div style='font:italic 900 26px Impact,Arial Black,sans-serif;color:#c9ccd1'>ガチャ　<span style='color:#f2b800'>${save.cr}</span></div><div style='width:min(400px,92vw);margin:8px 0;border:2px solid ${RC[2]};box-shadow:0 0 14px ${RC[2]};background:linear-gradient(135deg,#2a1442,#0d0d11);padding:8px;text-align:center'><b style='color:${RC[2]};font:italic 900 16px Impact,Arial Black,sans-serif'>PICK UP　SR</b><img src='${spu(12)}' style='width:200px;display:block;margin:0 auto'><b>マツダ RX-7</b><br><small style='color:#c9ccd1'>SRの中で50%の確率で出現</small></div><div class='r' style='display:block;line-height:1.6;font-size:13px'>${[0,1,2,3].map(r=>`<span style='color:${RC[r]};font-weight:900'>${RN[r]}</span> ${[55,30,12,3][r]}%　`).join('')}<br><small style='color:#c9ccd1'>重複した車は、クレジットに変わります（N 300 / R 1000 / SR 4000 / SSR 12000）。10連はSR以上が1台以上確定です。</small></div><div><button class='s'${SB} ${o1?'disabled':''} onclick='pull(1)'>1回 2000</button> <button class='s'${SB} ${o10?'disabled':''} onclick='pull(10)'>10連 18000</button></div><button class='m' style='margin-top:6px' onclick='home()'>戻る</button>`}
function garage(){const n=save.own.length;ov.innerHTML=`<div style='font:italic 900 24px Impact,Arial Black,sans-serif;color:#c9ccd1'>車図鑑　<small style='color:#f2b800'>${n}/${CARS.length}</small>　<small style='color:#c9ccd1'>${save.cr}クレジット</small></div><div style='display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(440px,94vw);margin:8px 0'>${CARS.map((c,i)=>{const o=save.own.includes(i),r=RAR[i],col=RC[r];return `<div onclick='gdet(${i})' style='border:2px solid ${o?col:'#33333a'};background:#121216;padding:3px 1px 2px;text-align:center;font-size:10px;line-height:1.25;position:relative'><span style='position:absolute;top:1px;left:3px;color:${col};font:italic 900 11px Impact,sans-serif'>${RN[r]}</span><img src='${spu(i)}' style='width:100%;display:block;${o?'':'filter:brightness(0) opacity(.45)'}'>${o?c.n:'？？？'}${save.car==i?"<div style='color:#ffdf00'>使用中</div>":''}</div>`}).join('')}</div><div style='font-size:12px;color:#c9ccd1'>車をタップすると、詳細と強化ができます</div><button class='s'${SB} onclick='home()'>戻る</button>`}
function gdet(i){gv=i;const c=CARS[i],o=save.own.includes(i),r=RAR[i],col=RC[r],t=save.tn[i]||[0,0,0,0],A=c.a*(1+.06*t[0]),G=c.g*(1+.06*t[1]),T=c.t/(1-.04*t[3]),B=1+.1*t[2];
let h=`<div style='font:italic 900 22px Impact,Arial Black,sans-serif;color:#c9ccd1'>車図鑑　<small style='color:#f2b800'>${save.cr}クレジット</small></div><div class='r' style='display:block;text-align:center;border:2px solid ${col};box-shadow:0 0 12px ${col}'><b style='color:${col};font:italic 900 16px Impact,sans-serif'>${RN[r]}</b> <b style='font-size:19px'>${c.n}</b>${save.car==i?" <small style='color:#ffdf00'>使用中</small>":''}<img src='${spu(i)}' style='width:190px;display:block;margin:2px auto'><div style='text-align:left;line-height:1.55;font-size:13px'>加速　　${bar(A,1.9)}<br>グリップ ${bar(G,1.7)}<br>最高速　${bar(T,1.7)}<br>ブレーキ ${bar(B,1.5)}</div></div>`;
h+=save.car!=i?`<button class='s' style='padding:8px 30px;font-size:19px;margin:6px 0' ${!o&&(c.gacha||save.cr<c.p)?'disabled':''} onclick='act(${i})'>${o?'この車に乗る':c.gacha?'ガチャ限定':'購入 '+c.p}</button>`:'';
h+=`<div style='margin-top:4px;color:#c9ccd1;font-size:14px'>強化${o?'':'（入手後に可能）'}</div>`;
TUN.forEach((u,k)=>{const lv=t[k];h+=`<div class='r'><span>${u}　<span style='color:#e10600;letter-spacing:2px'>${'■'.repeat(lv)}</span><span style='color:#555;letter-spacing:2px'>${'■'.repeat(5-lv)}</span><br><small style='color:#c9ccd1'>${TD[k]}</small></span><button class='m' ${!o||lv>=5||save.cr<cost(lv)?'disabled':''} onclick='tune(${k})'>${lv>=5?'最大':'強化 '+cost(lv)}</button></div>`});
ov.innerHTML=h+`<button class='s' style='padding:8px 30px;font-size:19px;margin-top:6px' onclick='garage()'>図鑑へ戻る</button>`}
function act(i){const c=CARS[i];if(!save.own.includes(i)){if(c.gacha||save.cr<c.p)return;save.cr-=c.p;save.own.push(i)}save.car=i;gv=i;store();gdet(i)}
function tune(k){if(!save.own.includes(gv))return;const t=save.tn[gv]||(save.tn[gv]=[0,0,0,0]),lv=t[k];if(lv>=5||save.cr<cost(lv))return;save.cr-=cost(lv);t[k]++;store();gdet(gv)}
buildTrack(save.course);cars=[];P=null;splash();requestAnimationFrame(loop);
</script></body></html>
